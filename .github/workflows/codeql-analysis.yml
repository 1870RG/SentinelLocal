name: "CodeQL Security Analysis"

# Run CodeQL analysis on push, PR, schedule, and manual trigger
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at 10:00 UTC to catch new vulnerabilities
    - cron: '0 10 * * 1'
  workflow_dispatch:

# Minimal permissions required for CodeQL analysis
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level permissions - minimal required for CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Only JavaScript/TypeScript - primary languages in repo
        language: [ 'javascript-typescript' ]

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      # Step 2: Initialize CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          languages: ${{ matrix.language }}
          # Use security-extended query suite for comprehensive scanning
          queries: security-extended
          # Optimize for JavaScript/TypeScript projects
          config: |
            paths-ignore:
              - node_modules
              - dist
              - build
              - '**/*.test.ts'
              - '**/*.test.js'
              - '**/*.spec.ts'
              - '**/*.spec.js'

      # Step 3: Cache dependencies for faster builds
      - name: Cache Node.js modules
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      # Step 5: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 6: Build the project (required for TypeScript analysis)
      - name: Build project
        run: npm run build --if-present
        continue-on-error: true

      # Step 7: Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results even if there are errors
          upload: true
